# ─── Nginx Reverse Proxy for mawaDao ───────────────────────────
#
# Routes requests to the correct microservice based on hostname and path.
#
# In production, Cloudflare proxies → Nginx → microservices (all
# running as Cloud Run services or containers). In dev, this same
# config can be loaded via `nginx -c /path/to/this/file` after
# adjusting the `upstream` blocks to point at localhost ports.
#
# TLS: Uses Cloudflare Origin Certificates (Full Strict mode).
# Place the cert/key at:
#   /etc/ssl/mawadao/origin.pem       (certificate)
#   /etc/ssl/mawadao/origin-key.pem   (private key)
#
# Usage (Docker):
#   docker run -d --name mawadao-lb \
#     -p 80:80 -p 443:443 \
#     -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v /etc/ssl/mawadao:/etc/ssl/mawadao:ro \
#     nginx:alpine
#
# Usage (local dev):
#   Replace upstream targets with 127.0.0.1:<port>
#   Run:  nginx -c $(pwd)/nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 100;

    # ── Security headers (Cloudflare adds its own; these are defense-in-depth) ─
    add_header X-Content-Type-Options  nosniff       always;
    add_header X-Frame-Options         SAMEORIGIN    always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;

    # ── Gzip ───────────────────────────────────────────────────
    gzip            on;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml text/javascript image/svg+xml;

    # ── Cloudflare real-IP restoration ─────────────────────────
    # When behind Cloudflare, $remote_addr is a CF edge IP.
    # Restore the true client IP so rate limiting & allow/deny work correctly.
    # Source: https://www.cloudflare.com/ips-v4 / ips-v6
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Rate limiting zones ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:5m      rate=5r/s;

    # ── TLS defaults (shared across all SSL servers) ───────────
    ssl_certificate     /etc/ssl/mawadao/origin.pem;
    ssl_certificate_key /etc/ssl/mawadao/origin-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Upstream services ──────────────────────────────────────
    # Adjust addresses for your environment (containers, Cloud Run URLs, etc.)
    upstream frontend {
        server 127.0.0.1:3000;
    }

    upstream tenant_dashboard {
        server 127.0.0.1:3001;
    }

    upstream cloud_run_deployer {
        server 127.0.0.1:3002;
    }

    upstream configuration_api {
        server 127.0.0.1:3003;
    }

    upstream dns_service {
        server 127.0.0.1:3004;
    }

    upstream auth_service {
        server 127.0.0.1:8080;
    }

    upstream gateway {
        server 127.0.0.1:19001;
    }

    # ── Default: reject unknown hosts ──────────────────────────
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    # ── HTTP → HTTPS redirect for all mawaDao hosts ────────────
    server {
        listen 80;
        server_name mawadao.com www.mawadao.com auth.mawadao.com *.mawadao.com;
        return 301 https://$host$request_uri;
    }

    # ══════════════════════════════════════════════════════════
    # Main site — mawadao.com / www.mawadao.com
    # ══════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name mawadao.com www.mawadao.com;

        # HSTS (let Cloudflare handle the outer HSTS; this covers origin)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Health check (for load balancer probes)
        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Auth service
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Configuration API
        location /api/v1/ {
            limit_req zone=api_global burst=50 nodelay;
            proxy_pass http://configuration_api/api/v1/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large body for file uploads
            client_max_body_size 10m;
        }

        # Gateway WebSocket
        location /ws {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            # WebSockets are bidirectional; both read and send timeouts must be
            # extended. Without proxy_send_timeout, nginx defaults to 60s which
            # silently tore down chat streams whenever a client paused reads
            # (tab backgrounded, slow network). proxy_buffering must be off so
            # frames are flushed immediately rather than batched.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }

        # Cloud Run Deployer (internal — service-to-service only)
        location /internal/deployer/ {
            # Restrict to internal/private networks; deny all public traffic
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            proxy_pass http://cloud_run_deployer/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # DNS Service (internal — service-to-service only)
        location /internal/dns/ {
            # Restrict to internal/private networks; deny all public traffic
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny  all;

            proxy_pass http://dns_service/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════
    # Auth subdomain — auth.mawadao.com
    # ══════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name auth.mawadao.com;

        limit_req zone=auth burst=10 nodelay;

        location / {
            proxy_pass http://auth_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ══════════════════════════════════════════════════════════
    # Tenant subdomains — *.mawadao.com  (username.mawadao.com)
    # ══════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.mawadao\.com$;

        # Tenant dashboard Next.js app
        location / {
            proxy_pass http://tenant_dashboard;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant          $tenant;
        }

        # Gateway WebSocket for tenant
        location /ws {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Tenant   $tenant;
            # See main /ws block above for rationale.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering    off;
        }
    }
}
