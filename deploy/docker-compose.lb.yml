version: "3.8"

# Load balancer (Nginx reverse proxy) for the maavaDao multi-service stack.
# Usage:
#   docker compose -f infra/docker-compose.lb.yml up -d

services:
  lb:
    image: nginx:alpine
    container_name: maavadao-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/maavadao:ro
    extra_hosts:
      # Let Nginx resolve localhost services from within the container
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
