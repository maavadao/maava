name: microservices/storage

on:
  push:
    branches: [main]
    paths: ["microservices/storage/**", ".github/workflows/microservice-storage.yml"]
  pull_request:
    paths: ["microservices/storage/**", ".github/workflows/microservice-storage.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/storage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: microservices/storage/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  image:
    needs: build
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawa-storage
      context: microservices/storage
