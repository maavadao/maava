name: microservices/storage

on:
  push:
    branches: [main]
    paths: ["microservices/storage/**", ".github/workflows/microservice-storage.yml"]
  pull_request:
    paths: ["microservices/storage/**", ".github/workflows/microservice-storage.yml"]

defaults:
  run:
    working-directory: microservices/storage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: microservices/storage/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Build image
        run: docker build -t ci .
