name: Release microservice

# Tag <service>-vX.Y.Z (for example auth-v0.2.0) to publish
# ghcr.io/maavadao/maava-<service>:X.Y.Z and a GitHub release.
on:
  push:
    tags:
      - "auth-v*.*.*"
      - "storage-v*.*.*"
      - "channels-v*.*.*"
      - "deployer-v*.*.*"
      - "skills-v*.*.*"
      - "platform-v*.*.*"
      - "manager-v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: tag
        run: |
          echo "service=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: microservices/${{ steps.tag.outputs.service }}
          push: true
          tags: |
            ghcr.io/maavadao/maava-${{ steps.tag.outputs.service }}:${{ steps.tag.outputs.version }}
            ghcr.io/maavadao/maava-${{ steps.tag.outputs.service }}:latest
      - uses: softprops/action-gh-release@v2
        with:
          name: maava-${{ steps.tag.outputs.service }} ${{ steps.tag.outputs.version }}
          generate_release_notes: true
