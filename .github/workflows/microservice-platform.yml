name: microservices/platform

on:
  push:
    branches: [main]
    paths: ["microservices/platform/**", ".github/workflows/microservice-platform.yml"]
  pull_request:
    paths: ["microservices/platform/**", ".github/workflows/microservice-platform.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/platform

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mawa_platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mawa_platform"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run migrations
        run: python db/migrate.py
      - name: Two-tenant RLS leakage suite
        run: python -m pytest -q

  image:
    needs: build
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawa-platform
      context: microservices/platform
