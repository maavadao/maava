name: microservices/manager

on:
  push:
    branches: [main]
    paths: ["microservices/manager/**", ".github/workflows/microservice-manager.yml"]
  pull_request:
    paths: ["microservices/manager/**", ".github/workflows/microservice-manager.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/manager

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app && python -c 'import app.main'

  image:
    needs: build
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawadao-agent-manager
      context: microservices/manager
