name: microservices/deployer

on:
  push:
    branches: [main]
    paths: ["microservices/deployer/**", ".github/workflows/microservice-deployer.yml"]
  pull_request:
    paths: ["microservices/deployer/**", ".github/workflows/microservice-deployer.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/deployer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: microservices/deployer/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(find src -name '*.js'); do node --check "$f"; done

  image:
    needs: build
    uses: maavadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: maava-deployer
      context: microservices/deployer
