name: microservices/channels

on:
  push:
    branches: [main]
    paths: ["microservices/channels/**", ".github/workflows/microservice-channels.yml"]
  pull_request:
    paths: ["microservices/channels/**", ".github/workflows/microservice-channels.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/channels

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: microservices/channels/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(find src -name '*.js'); do node --check "$f"; done

  image:
    needs: build
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawadao-agent-channels
      context: microservices/channels
