name: microservices/auth

on:
  push:
    branches: [main]
    paths: ["microservices/auth/**", ".github/workflows/microservice-auth.yml"]
  pull_request:
    paths: ["microservices/auth/**", ".github/workflows/microservice-auth.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/auth

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: microservices/auth/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  image:
    needs: build
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawadao-agent-auth
      context: microservices/auth
