name: microservices/auth

on:
  push:
    branches: [main]
    paths: ["microservices/auth/**", ".github/workflows/microservice-auth.yml"]
  pull_request:
    paths: ["microservices/auth/**", ".github/workflows/microservice-auth.yml"]

defaults:
  run:
    working-directory: microservices/auth

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: microservices/auth/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Build image
        run: docker build -t ci .
