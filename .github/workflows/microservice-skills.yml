name: microservices/skills

on:
  push:
    branches: [main]
    paths: ["microservices/skills/**", ".github/workflows/microservice-skills.yml"]
  pull_request:
    paths: ["microservices/skills/**", ".github/workflows/microservice-skills.yml"]

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: microservices/skills

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app && python -c 'import app.main'

  image:
    needs: build
    uses: maavadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: maava-skills
      context: microservices/skills
